<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>聽文件 · 文件朗讀器</title>
<meta name="description" content="上傳 PDF 或 Word，讓手機讀給你聽。支援中、英、日，可翻譯成中文，可調語速。">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161d2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="聽文件">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --ink:#161d2e;          /* 墨藍底 */
  --ink-2:#1e2739;        /* 面板 */
  --ink-3:#2a3548;        /* 邊線 */
  --paper:#ece9e1;        /* 主要文字 */
  --paper-dim:#9aa3b5;    /* 次要文字 */
  --vermilion:#d4452b;    /* 朱砂：主要動作 */
  --celadon:#7fb0a6;      /* 青瓷：語言／翻譯 */
  --gold:#d5ab63;         /* 收藏 */
  --radius:14px;
  --serif:"Songti TC","Songti SC","Noto Serif TC","Hiragino Mincho ProN","Yu Mincho",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Hiragino Sans",Roboto,"Helvetica Neue",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root{
    --ink:#eeebe3; --ink-2:#f7f5f0; --ink-3:#d9d4c8;
    --paper:#1d2436; --paper-dim:#6b7285;
    --vermilion:#bf3a21; --celadon:#3f7a70; --gold:#9a7526;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--paper); font-family:var(--sans);
  font-size:16px; line-height:1.55; overscroll-behavior-y:none;
  padding-bottom:calc(112px + var(--safe-b));
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--celadon);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ───────────────────────────── */
header{padding:26px 0 18px}
h1{
  font-family:var(--serif); font-weight:600; font-size:30px; line-height:1.15;
  margin:0; letter-spacing:.02em;
}
h1 .mark{display:inline-block;width:4px;height:26px;background:var(--vermilion);vertical-align:-3px;margin-right:10px;border-radius:2px}
header p{margin:8px 0 0 14px;color:var(--paper-dim);font-size:14px}

/* ── 上傳 ───────────────────────────── */
.dropzone{
  margin:6px 0 22px; border:1px dashed var(--ink-3); border-radius:var(--radius);
  background:var(--ink-2); padding:22px 18px; text-align:center;
  transition:border-color .15s, background .15s;
}
.dropzone.hot{border-color:var(--vermilion);background:var(--ink-2);background:color-mix(in srgb,var(--vermilion) 8%,var(--ink-2))}
.dropzone b{font-family:var(--serif);font-size:18px;font-weight:600;display:block;margin-bottom:4px}
.dropzone span{color:var(--paper-dim);font-size:13px}
.pick{
  display:inline-block;margin-top:14px;padding:11px 22px;border-radius:999px;
  background:var(--vermilion);color:#fff;font-weight:600;font-size:15px;
}
/* ── 分頁 ───────────────────────────── */
.tabs{display:flex;gap:6px;margin:0 0 14px}
.tabs button{
  padding:7px 14px;border-radius:999px;font-size:14px;color:var(--paper-dim);
  border:1px solid transparent;
}
.tabs button[aria-selected="true"]{color:var(--paper);border-color:var(--ink-3);background:var(--ink-2)}

/* ── 書櫃 ───────────────────────────── */
.card{
  background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--radius);
  padding:14px 14px 12px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;
}
.card .body{flex:1;min-width:0}
.card h3{
  margin:0 0 5px;font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.meta{font-size:12.5px;color:var(--paper-dim);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{border:1px solid var(--ink-3);border-radius:5px;padding:1px 6px;font-size:11.5px;color:var(--celadon)}
.bar{height:3px;background:var(--ink-3);border-radius:2px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--celadon)}
.card .acts{display:flex;flex-direction:column;gap:4px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:var(--paper-dim)}
.iconbtn.on{color:var(--gold)}
.play-sm{background:var(--vermilion);color:#fff;font-size:15px}
.empty{color:var(--paper-dim);text-align:center;padding:34px 10px;font-size:14px;line-height:1.7}

/* ── 閱讀器 ─────────────────────────── */
#reader{display:none}
#reader.show{display:block}
.rtop{display:flex;align-items:center;gap:10px;padding:16px 0 6px}
.rtop h2{flex:1;margin:0;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{font-size:22px;width:34px;height:34px;display:grid;place-items:center;margin-left:-6px}

.opts{display:flex;gap:8px;margin:10px 0 4px;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.opts::-webkit-scrollbar{display:none}
.opts .chip{flex:0 0 auto}
.chip{
  border:1px solid var(--ink-3);border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--paper-dim);
  background:var(--ink-2);
}
.chip.on{color:var(--paper);border-color:var(--celadon)}
.chip.busy{opacity:.55}

.sentences{margin:14px 0 8px}
.s{
  padding:9px 12px 9px 14px;border-left:3px solid transparent;border-radius:0 8px 8px 0;
  font-family:var(--serif);font-size:17.5px;line-height:1.85;color:var(--paper-dim);
  cursor:pointer;
}
.s.done{color:var(--paper-dim);color:color-mix(in srgb,var(--paper) 55%,transparent)}
.s.cur{
  border-left-color:var(--vermilion); background:var(--ink-2);
  color:var(--paper); font-size:19px;
}
.s .alt{display:block;margin-top:5px;font-family:var(--sans);font-size:13.5px;color:var(--celadon);line-height:1.6}
.more{width:100%;padding:12px;color:var(--paper-dim);font-size:14px;border:1px solid var(--ink-3);border-radius:10px;margin:6px 0}

/* ── 播放列 ─────────────────────────── */
.player{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--ink);
  background:color-mix(in srgb,var(--ink) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--ink-3);
  padding:10px 18px calc(10px + var(--safe-b));
  transform:translateY(120%);transition:transform .22s ease;
}
.player.show{transform:none}
.player .inner{max-width:720px;margin:0 auto}
.ptop{display:flex;justify-content:space-between;font-size:12px;color:var(--paper-dim);margin-bottom:6px}
.seek{width:100%;accent-color:var(--vermilion);margin:0 0 6px;height:22px}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrls button{
  height:46px;min-width:46px;border-radius:12px;border:1px solid var(--ink-3);
  display:grid;place-items:center;font-size:15px;color:var(--paper);background:var(--ink-2);padding:0 12px;
}
.ctrls .main{background:var(--vermilion);border-color:var(--vermilion);color:#fff;min-width:86px;font-weight:600;font-size:16px}
.ctrls .rate{font-variant-numeric:tabular-nums;font-size:14px;min-width:56px}

/* ── 提示 ───────────────────────────── */
#toast{
  position:fixed;left:50%;bottom:calc(130px + var(--safe-b));transform:translateX(-50%) translateY(10px);
  background:var(--ink-2);border:1px solid var(--ink-3);color:var(--paper);
  padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:60;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheet .panel{
  background:var(--ink);border-top:1px solid var(--ink-3);border-radius:18px 18px 0 0;
  width:100%;max-height:78vh;overflow:auto;padding:18px 18px calc(24px + var(--safe-b));
}
.sheet h4{font-family:var(--serif);font-size:18px;margin:0 0 4px}
.sheet .hint{color:var(--paper-dim);font-size:13px;margin:0 0 14px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ink-3)}
.row:last-child{border:0}
.row label{flex:1;font-size:14.5px}
select{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:9px;padding:9px 10px;max-width:58%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ═══ 書櫃 ═══ -->
<main id="shelf" class="wrap">
  <header>
    <h1><span class="mark"></span>聽文件</h1>
    <p>把 PDF、Word 交給手機，讓它讀給你聽。</p>
  </header>

  <div class="dropzone" id="dz">
    <b>加入一份文件</b>
    <span>支援 PDF、Word（.docx）、純文字。檔案只留在這支手機裡。</span><br>
    <label class="pick">選擇檔案<input type="file" id="file" accept=".pdf,.docx,.txt,.md,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" multiple hidden></label>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="all" aria-selected="true">全部</button>
    <button role="tab" data-tab="fav" aria-selected="false">收藏</button>
    <button role="tab" data-tab="recent" aria-selected="false">最近閱讀</button>
  </div>
  <div id="list"></div>
</main>

<!-- ═══ 閱讀器 ═══ -->
<main id="reader" class="wrap">
  <div class="rtop">
    <button class="back" id="back" aria-label="回到書櫃">‹</button>
    <h2 id="rtitle"></h2>
    <button class="iconbtn" id="rfav" aria-label="收藏">☆</button>
  </div>
  <div class="opts">
    <button class="chip on" id="cLang">原文</button>
    <button class="chip tl" data-tl="zh">中文</button>
    <button class="chip tl" data-tl="en">English</button>
    <button class="chip tl" data-tl="ja">日本語</button>
    <button class="chip tl" data-tl="el">Ελληνικά</button>
    <button class="chip tl" data-tl="la">Latina</button>
    <button class="chip tl" data-tl="he">עברית</button>
    <button class="chip" id="cSum">📝 重點整理</button>
    <button class="chip" id="cEngine">🔊 裝置語音</button>
    <button class="chip" id="cVoice">語音設定</button>
  </div>
  <div class="sentences" id="sents"></div>
</main>

<!-- ═══ 播放列 ═══ -->
<div class="player" id="player">
  <div class="inner">
    <div class="ptop"><span id="pPos">0 / 0</span><span id="pPct">0%</span></div>
    <input type="range" class="seek" id="seek" min="0" max="0" value="0" step="1" aria-label="朗讀進度">
    <div class="ctrls">
      <button id="bPrev" aria-label="上一句">⏮</button>
      <button class="main" id="bPlay">▶ 閱讀</button>
      <button id="bPause">⏸ 暫停</button>
      <button id="bStop">⏹ 停止</button>
      <button class="rate" id="bRate">1.0×</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- 重點整理與匯出 -->
<div class="sheet" id="sheetSum">
  <div class="panel">
    <h4>重點整理</h4>
    <p class="hint">分析全文的詞頻與句子權重，挑出最有代表性的句子。整個過程在手機裡完成，文件不會上傳。</p>
    <div class="row"><label>摘要比例</label><select id="sRatio">
      <option value="0.08">很精簡（8%）</option>
      <option value="0.15" selected>標準（15%）</option>
      <option value="0.25">詳細（25%）</option>
      <option value="0.4">很詳細（40%）</option>
    </select></div>
    <div class="row"><label>附上全文逐字稿</label><select id="sFull">
      <option value="1" selected>附上</option><option value="0">只要重點</option></select></div>
    <div class="row" id="rowBi" style="display:none"><label>逐字稿加上譯文對照</label><select id="sBi">
      <option value="0" selected>不要</option><option value="1">要</option></select></div>
    <div class="row" style="gap:8px;padding-top:14px;border:0">
      <button class="chip on" id="sMake" style="flex:1;padding:12px">產生</button>
      <button class="chip" id="sClose" style="padding:12px 18px">關閉</button>
    </div>
    <pre id="sPrev" style="display:none;white-space:pre-wrap;word-break:break-word;font-family:var(--sans);
      font-size:13px;line-height:1.7;background:var(--ink-2);border:1px solid var(--ink-3);
      border-radius:10px;padding:12px;max-height:38vh;overflow:auto;margin:14px 0 0"></pre>
    <div class="row" id="sActs" style="display:none;gap:8px;padding-top:12px;border:0">
      <button class="chip on" id="sSave" style="flex:1;padding:12px">下載 .txt</button>
      <button class="chip" id="sCopy" style="padding:12px 18px">複製</button>
    </div>
  </div>
</div>

<!-- 語音設定 -->
<div class="sheet" id="sheetVoice">
  <div class="panel">
    <h4>語音設定</h4>
    <p class="hint">手機內建的語音清單。iPhone 可到「設定 › 輔助使用 › 朗讀內容 › 聲音」下載更自然的中文、日文語音。</p>
    <div class="row"><label>中文</label><select id="vZh"></select></div>
    <div class="row"><label>英文</label><select id="vEn"></select></div>
    <div class="row"><label>日文</label><select id="vJa"></select></div>
    <div class="row"><label>希臘文</label><select id="vEl"></select></div>
    <div class="row"><label>希伯來文</label><select id="vHe"></select></div>
    <div class="row"><label>拉丁文<br><span style="font-size:12px;color:var(--paper-dim)">沒有拉丁文語音，預設用義大利文發音</span></label><select id="vLa"></select></div>
    <div class="row"><label>朗讀方式<br><span style="font-size:12px;color:var(--paper-dim)">背景播放＝螢幕關掉也能繼續聽，但需要網路</span></label>
      <select id="vEngine">
        <option value="device">裝置語音（可離線）</option>
        <option value="audio">背景播放（可鎖屏）</option>
      </select></div>
    <div class="row"><label>播放時不讓螢幕自動關閉</label><select id="vWake">
      <option value="1">開啟</option><option value="0">關閉</option></select></div>
    <div class="row"><label>語速</label><select id="vRate">
      <option value="0.75">0.75×</option><option value="1" selected>1×</option>
      <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
    </select></div>
    <div class="row"><label>同時顯示原文（翻譯模式）</label><select id="vShowSrc">
      <option value="1">顯示</option><option value="0">不顯示</option></select></div>
    <div class="row"><label>這份文件的原文語言<br><span style="font-size:12px;color:var(--paper-dim)">拉丁文和英文都用拉丁字母，程式分不出來，請在這裡指定</span></label>
      <select id="vDocLang">
        <option value="">自動判斷</option>
        <option value="zh">中文</option><option value="en">英文</option><option value="ja">日文</option>
        <option value="el">希臘文</option><option value="la">拉丁文</option><option value="he">希伯來文</option>
      </select></div>
    <div class="row" style="justify-content:center;padding-top:16px">
      <button class="chip on" id="vClose" style="padding:11px 28px">完成</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
"use strict";
/* ═══════════════════════════════════════════════
   聽文件 — 離線文件朗讀器
   資料全部存在瀏覽器的 IndexedDB，不會上傳到任何伺服器，
   唯一的對外連線是「翻譯」功能（需要網路）。
   ═══════════════════════════════════════════════ */

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const MAXLEN = 150;                       // 單句最長字數，避免行動裝置 TTS 截斷
// 支援的語言。la（拉丁文）沒有任何手機內建語音，用義大利文發音近似教會拉丁文。
const LANGS     = ['zh','en','ja','el','la','he'];
const LANG_CODE = { zh:'zh-TW', en:'en-US', ja:'ja-JP', el:'el-GR', la:'it-IT', he:'he-IL' };
const LANG_NAME = { zh:'中文', en:'英文', ja:'日文', el:'希臘文', la:'拉丁文', he:'希伯來文' };
// 挑語音時的偏好順序
const VOICE_PREFS = {
  zh:['zh-tw','zh-hk','zh-cn','zh','cmn'],
  en:['en-us','en-gb','en'],
  ja:['ja-jp','ja'],
  el:['el-gr','el'],
  he:['he-il','he','iw'],
  la:['la','it-it','it','es-es','es','pt','ro']
};
// 語音設定清單裡要列出哪些語系
const VOICE_FILTER = { zh:['zh','cmn','yue'], en:['en'], ja:['ja'], el:['el'], he:['he','iw'], la:['la','it','es','pt','ro'] };

/* ── 小工具 ───────────────────────────────── */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
let toastTimer;
function toast(msg, ms = 2200){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function fmtTime(ts){
  if(!ts) return '尚未閱讀';
  const d = (Date.now() - ts) / 1000;
  if(d < 60) return '剛剛';
  if(d < 3600) return Math.floor(d/60) + ' 分鐘前';
  if(d < 86400) return Math.floor(d/3600) + ' 小時前';
  if(d < 86400*7) return Math.floor(d/86400) + ' 天前';
  return new Date(ts).toLocaleDateString('zh-TW');
}
function fmtDur(sec){
  sec = Math.round(sec||0);
  if(sec < 60) return sec + ' 秒';
  const m = Math.floor(sec/60);
  return m < 60 ? m + ' 分鐘' : Math.floor(m/60) + ' 小時 ' + (m%60) + ' 分';
}

/* ── 資料庫 ───────────────────────────────── */
let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('listen-doc', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('docs')) d.createObjectStore('docs', { keyPath:'id' });
      if(!d.objectStoreNames.contains('kv'))   d.createObjectStore('kv');
    };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
function dbPut(store, val, key){
  return new Promise((res, rej) => {
    const r = key === undefined ? tx(store,'readwrite').put(val) : tx(store,'readwrite').put(val, key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function dbGet(store, key){
  return new Promise((res, rej) => {
    const r = tx(store,'readonly').get(key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function dbAll(store){
  return new Promise((res, rej) => {
    const r = tx(store,'readonly').getAll();
    r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
  });
}
function dbDel(store, key){
  return new Promise((res, rej) => {
    const r = tx(store,'readwrite').delete(key);
    r.onsuccess = () => res(); r.onerror = () => rej(r.error);
  });
}

/* ── 設定 ─────────────────────────────────── */

const DEFAULTS = { rate:1, voice:{zh:'',en:'',ja:''}, showSrc:1, engine:'device', wakelock:1 };

/* ═══ 一、文件解析 ═══════════════════════════ */
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function readPDF(buf, onProgress){
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    let line = '', lastY = null, out = '';
    for(const it of tc.items){
      const y = it.transform[5];
      if(lastY !== null && Math.abs(y - lastY) > 3){ out += line.trim() + '\n'; line = ''; }
      line += it.str;
      if(it.hasEOL) { out += line.trim() + '\n'; line = ''; }
      lastY = y;
    }
    out += line;
    pages.push(out);
    onProgress && onProgress(p, pdf.numPages);
    if(p % 5 === 0) await new Promise(r => setTimeout(r)); // 讓畫面有機會更新
  }
  return pages.join('\n\n');
}
async function readDOCX(buf){
  const r = await mammoth.extractRawText({ arrayBuffer: buf });
  return r.value || '';
}

/* ═══ 二、切句與語言判斷 ═════════════════════ */
const RE_KANA  = /[\u3040-\u309F\u30A0-\u30FF]/;
const RE_HAN   = /[\u4E00-\u9FFF\u3400-\u4DBF]/;
const RE_LATIN = /[A-Za-z]/;
const RE_GREEK = /[\u0370-\u03FF\u1F00-\u1FFF]/;   // 含多調符號的古希臘文
const RE_HEB   = /[\u0590-\u05FF\uFB1D-\uFB4F]/;

function detectDocLang(text){
  const s = text.slice(0, 20000);
  const kana  = (s.match(/[\u3040-\u309F\u30A0-\u30FF]/g) || []).length;
  const han   = (s.match(/[\u4E00-\u9FFF]/g) || []).length;
  const latin = (s.match(/[A-Za-z]/g) || []).length;
  const greek = (s.match(/[\u0370-\u03FF\u1F00-\u1FFF]/g) || []).length;
  const heb   = (s.match(/[\u0590-\u05FF\uFB1D-\uFB4F]/g) || []).length;
  if(heb   > 8 && heb   > latin * 0.3) return 'he';
  if(greek > 8 && greek > latin * 0.3) return 'el';
  if(kana  > 8 && kana  > s.length * 0.004) return 'ja';
  if(han > latin * 0.25 && han > 8) return 'zh';
  if(latin > 0) return 'en';   // 拉丁文同樣是拉丁字母，無法自動分辨，需在閱讀器裡手動指定
  return 'zh';
}
function sentLang(s, docLang){
  if(RE_HEB.test(s)) return 'he';
  if(RE_GREEK.test(s)) return 'el';
  if(RE_KANA.test(s)) return 'ja';
  const han = (s.match(RE_HAN) || []).length;
  const lat = (s.match(RE_LATIN) || []).length;
  if(han === 0 && lat > 0) return docLang === 'la' ? 'la' : 'en';
  if(han > 0) return docLang === 'ja' ? 'ja' : 'zh';
  return docLang;
}
function hardWrap(s){
  if(s.length <= MAXLEN) return [s];
  const out = []; let buf = '';
  for(let i = 0; i < s.length; i++){
    buf += s[i];
    if(buf.length >= MAXLEN){
      let cut = -1;
      for(let j = buf.length - 1; j > MAXLEN * 0.45; j--){
        if('、，,；;:：）)」』 '.indexOf(buf[j]) >= 0){ cut = j; break; }
      }
      if(cut > 0){ out.push(buf.slice(0, cut + 1)); buf = buf.slice(cut + 1); }
      else { out.push(buf); buf = ''; }
    }
  }
  if(buf.trim()) out.push(buf);
  return out;
}
function splitSentences(raw){
  const text = String(raw || '')
    .replace(/\r/g, '')
    .replace(/\u00AD/g, '')
    .replace(/[ \t]{2,}/g, ' ');
  const paras = text.split(/\n+/).map(p => p.trim()).filter(p => p.length);
  const ENDERS = '。．！？!?；;…〜';
  const CLOSERS = '」』”’）)】》"\'';
  const out = [];
  const push = s => { s = s.trim(); if(s) hardWrap(s).forEach(x => { if(x.trim()) out.push(x.trim()); }); };
  for(const p of paras){
    let buf = '';
    for(let i = 0; i < p.length; i++){
      const ch = p[i]; buf += ch;
      let isEnd = ENDERS.indexOf(ch) >= 0;
      if(!isEnd && ch === '.'){
        const nxt = p[i+1] || ' ';
        const prv = p[i-1] || ' ';
        isEnd = /[\s]/.test(nxt) && !/\d/.test(prv) && !/^[a-z]/.test(p[i+2] || '');
      }
      if(isEnd){
        while(i + 1 < p.length && CLOSERS.indexOf(p[i+1]) >= 0) buf += p[++i];
        push(buf); buf = '';
      }
    }
    push(buf);
  }
  return out.length ? out : (text.trim() ? [text.trim().slice(0, MAXLEN)] : []);
}

/* ═══ 三、語音 ═══════════════════════════════ */
let voices = [];
function refreshVoices(){
  voices = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  if(voices.length) fillVoiceSelects();
}
function pickVoice(lang){
  const saved = settings.voice[lang];
  if(saved){ const v = voices.find(v => v.voiceURI === saved); if(v) return v; }
  const prefs = VOICE_PREFS[lang] || [];
  for(const p of prefs){
    const v = voices.find(v => (v.lang || '').replace('_','-').toLowerCase().indexOf(p) === 0);
    if(v) return v;
  }
  return null;
}
function fillVoiceSelects(){
  [['zh','#vZh'],['en','#vEn'],['ja','#vJa'],['el','#vEl'],['la','#vLa'],['he','#vHe']].forEach(([lang, sel]) => {
    const el = $(sel); if(!el) return;
    const prefix = VOICE_FILTER[lang];
    const list = voices.filter(v => prefix.some(p => (v.lang||'').toLowerCase().indexOf(p) === 0));
    el.innerHTML = '<option value="">自動選擇</option>' +
      list.map(v => `<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join('');
    el.value = settings.voice[lang] || '';
    if(lang === 'la' && list.length) el.querySelector('option').textContent = '自動選擇（義大利文優先）';
    if(!list.length) el.innerHTML = '<option value="">這支手機沒有' + LANG_NAME[lang] + '語音</option>';
  });
  $('#vRate').value = String(settings.rate);
  $('#vShowSrc').value = String(settings.showSrc);
}
if(window.speechSynthesis){
  refreshVoices();
  speechSynthesis.onvoiceschanged = refreshVoices;
  setTimeout(refreshVoices, 400);
  setTimeout(refreshVoices, 1500);
}

/* ═══ 四、播放引擎 ═══════════════════════════ */
const P = { doc:null, idx:0, playing:false, paused:false, mode:'original', win:[0,0], t0:0 };
let keepAlive = null, saveCount = 0, gen = 0;

// 有些瀏覽器 cancel() 之後會補送 onend，會害下一句被跳過或重讀一次。
// 每次朗讀給一個編號，只有最新編號的回呼算數。
function hardCancel(){
  gen++;
  try{ speechSynthesis.cancel(); }catch(e){}
  if(audioEl){ try{ audioEl.pause(); }catch(e){} }
}

/* ── 背景播放引擎 ───────────────────────────
   手機的語音合成（speechSynthesis）在螢幕鎖住時一定會被系統中斷，這是
   瀏覽器的限制，繞不過去。所以另外做一條路：把每一句轉成 MP3，用一般的
   <audio> 播放器播。音訊播放在鎖屏／切到別的 App 時會繼續，還能在鎖定
   畫面顯示控制按鈕。代價是需要網路。
   要換成別的語音服務（例如自己的 Google Cloud TTS 金鑰），只要改 ttsUrl()。 */
const TTS_CODE = { zh:'zh-TW', en:'en', ja:'ja', el:'el', la:'la', he:'iw' };
let audioEl = null, preloadEl = null, audioFailed = 0;

function ttsUrl(text, lang){
  const t = String(text).slice(0, 190);            // 這個端點單次上限約 200 字
  return 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' +
         (TTS_CODE[lang] || 'en') + '&total=1&idx=0&textlen=' + t.length +
         '&q=' + encodeURIComponent(t);
}
function getAudio(){
  if(audioEl) return audioEl;
  audioEl = new Audio();
  audioEl.preload = 'auto';
  audioEl.setAttribute('playsinline', '');
  audioEl.crossOrigin = null;
  return audioEl;
}
function audioSpeakAt(i){
  const list = items();
  if(i >= list.length){ finish(); return; }
  const it = list[i];
  const myGen = ++gen;
  const el = getAudio();
  el.playbackRate = settings.rate;
  try{ el.preservesPitch = true; el.mozPreservesPitch = true; el.webkitPreservesPitch = true; }catch(e){}
  el.onended = () => {
    if(myGen !== gen || !P.playing || P.paused) return;
    P.idx = i + 1;
    bumpProgress();
    if(P.idx >= list.length){ finish(); return; }
    highlight(P.idx);
    audioSpeakAt(P.idx);
  };
  el.onerror = () => {
    if(myGen !== gen || !P.playing || P.paused) return;
    if(++audioFailed >= 3){                        // 連續失敗就退回裝置語音，不要卡住
      audioFailed = 0;
      settings.engine = 'device'; saveSettings(); syncEngineChip();
      toast('背景播放連不上，先改用裝置語音', 4000);
      speakAt(P.idx);
      return;
    }
    P.idx = i + 1;
    if(P.idx >= list.length){ finish(); return; }
    highlight(P.idx); audioSpeakAt(P.idx);
  };
  el.onplaying = () => { audioFailed = 0; };
  el.src = ttsUrl(it.text, it.lang);
  const pr = el.play();
  if(pr && pr.catch) pr.catch(() => {});
  // 先把下一句抓下來，換句時比較不會卡頓
  if(list[i+1]){
    try{
      preloadEl = preloadEl || new Audio();
      preloadEl.preload = 'auto';
      preloadEl.src = ttsUrl(list[i+1].text, list[i+1].lang);
    }catch(e){}
  }
  highlight(i);
  setMediaMetadata();
}

/* 鎖定畫面／耳機的播放控制 */
function setMediaMetadata(){
  if(!('mediaSession' in navigator) || !P.doc) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: P.doc.name,
      artist: (P.idx + 1) + ' / ' + total() + ' 句',
      album: '聽文件',
      artwork: [{ src:'icon-512.png', sizes:'512x512', type:'image/png' },
                { src:'icon-192.png', sizes:'192x192', type:'image/png' }]
    });
    navigator.mediaSession.playbackState = (P.playing && !P.paused) ? 'playing' : 'paused';
  }catch(e){}
}
function initMediaSession(){
  if(!('mediaSession' in navigator)) return;
  const set = (a, fn) => { try{ navigator.mediaSession.setActionHandler(a, fn); }catch(e){} };
  set('play',          () => { if(P.paused) resume(); else if(!P.playing) play(); });
  set('pause',         () => pause());
  set('stop',          () => stop());
  set('previoustrack', () => jump(P.idx - 1));
  set('nexttrack',     () => jump(P.idx + 1));
  set('seekbackward',  () => jump(P.idx - 5));
  set('seekforward',   () => jump(P.idx + 5));
}

/* 螢幕保持不睡（裝置語音模式下很有用） */
let wakeLock = null;
async function requestWakeLock(){
  if(!settings.wakelock || !('wakeLock' in navigator)) return;
  try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
function releaseWakeLock(){ if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; } }

function items(){
  const d = P.doc; if(!d) return [];
  if(P.mode !== 'original'){
    const t = getTrans(d, P.mode);
    if(t) return t.map((x, i) => ({ text:x || d.sentences[i], lang:P.mode, src:d.sentences[i] }));
  }
  return d.sentences.map((s, i) => ({ text:s, lang:d.langs[i], src:null }));
}
// 取出某個語言的完整譯文；沒有或長度對不上就回 null
function getTrans(doc, tl){
  migrate(doc);
  const t = doc.translations && doc.translations[tl];
  return (t && t.length === doc.sentences.length) ? t : null;
}
// 舊版只存中文譯文，開啟時搬到新結構
function migrate(doc){
  if(!doc.translations) doc.translations = {};
  if(doc.translation && doc.translation.length === doc.sentences.length && !doc.translations.zh){
    doc.translations.zh = doc.translation;
  }
  return doc;
}
function transLangs(doc){
  migrate(doc);
  return ['zh','en','ja'].filter(l => doc.translations[l] && doc.translations[l].length === doc.sentences.length);
}
function total(){ return P.doc ? P.doc.sentences.length : 0; }

function unlockAudio(){
  // iOS 必須在使用者手勢中先呼叫一次 speak()，之後才能由程式連續朗讀
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0; u.rate = 2;
    speechSynthesis.speak(u);
  }catch(e){}
}
function play(fromIdx){
  if(!P.doc) return;
  const bg = settings.engine === 'audio';
  if(!bg && !window.speechSynthesis){ toast('這個瀏覽器不支援語音朗讀'); return; }
  if(bg && !navigator.onLine){ toast('背景播放需要網路連線', 3500); return; }
  if(typeof fromIdx === 'number') P.idx = Math.max(0, Math.min(fromIdx, total() - 1));
  if(P.idx >= total()) P.idx = 0;
  hardCancel();
  if(!P.playing && !bg) unlockAudio();
  P.playing = true; P.paused = false; P.t0 = Date.now();
  startKeepAlive(); requestWakeLock();
  speakAt(P.idx);
  syncButtons(); setMediaMetadata();
}
// 依設定分派到兩個引擎
function speakAt(i){
  return settings.engine === 'audio' ? audioSpeakAt(i) : deviceSpeakAt(i);
}
function deviceSpeakAt(i){
  const list = items();
  if(i >= list.length){ finish(); return; }
  const it = list[i];
  const myGen = ++gen;
  const u = new SpeechSynthesisUtterance(it.text);
  const v = pickVoice(it.lang);
  if(v) u.voice = v;
  u.lang = v ? v.lang : (LANG_CODE[it.lang] || 'zh-TW');
  u.rate = settings.rate; u.pitch = 1; u.volume = 1;
  u.onend = () => {
    if(myGen !== gen || !P.playing || P.paused) return;
    P.idx = i + 1;
    bumpProgress();
    if(P.idx >= list.length){ finish(); return; }
    highlight(P.idx);
    deviceSpeakAt(P.idx);
  };
  u.onerror = e => {
    const err = e && e.error;
    if(myGen !== gen || err === 'interrupted' || err === 'canceled') return;
    if(!P.playing || P.paused) return;
    P.idx = i + 1;                       // 跳過壞掉的一句，繼續往下
    if(P.idx >= list.length){ finish(); return; }
    highlight(P.idx); deviceSpeakAt(P.idx);
  };
  speechSynthesis.speak(u);
  highlight(i);
  setMediaMetadata();
}
function pause(){
  if(!P.playing) return;
  P.paused = true;
  if(settings.engine === 'audio'){
    if(audioEl){ try{ audioEl.pause(); }catch(e){} }
  }else{
    try{ speechSynthesis.pause(); }catch(e){}
    // 少數 Android 瀏覽器沒有真正的 pause，這時只能中斷，繼續時從這一句頭再讀
    setTimeout(() => {
      if(P.paused && !speechSynthesis.paused && speechSynthesis.speaking) hardCancel();
    }, 350);
  }
  stopKeepAlive(); releaseWakeLock(); accumulateTime(); saveProgress(true);
  syncButtons(); setMediaMetadata();
}
function resume(){
  if(!P.doc) return;
  if(!P.paused){ play(); return; }
  P.paused = false; P.playing = true; P.t0 = Date.now();
  startKeepAlive(); requestWakeLock();
  if(settings.engine === 'audio'){
    if(audioEl && audioEl.src){
      const pr = audioEl.play();
      if(pr && pr.catch) pr.catch(() => { hardCancel(); audioSpeakAt(P.idx); });
    }else audioSpeakAt(P.idx);
  }else{
    try{ speechSynthesis.resume(); }catch(e){}
    setTimeout(() => {
      if(!P.playing || P.paused) return;
      if(!speechSynthesis.speaking){ hardCancel(); deviceSpeakAt(P.idx); }  // 後備：從這一句頭重讀
    }, 320);
  }
  syncButtons(); setMediaMetadata();
}
function stop(){
  P.playing = false; P.paused = false;
  hardCancel();
  stopKeepAlive(); releaseWakeLock(); accumulateTime(); saveProgress(true);
  syncButtons(); setMediaMetadata();
}
function finish(){
  P.playing = false; P.paused = false; P.idx = total();
  hardCancel();
  stopKeepAlive(); releaseWakeLock(); accumulateTime();
  if(P.doc) P.doc.finished = true;
  saveProgress(true); syncButtons(); updateSeek();
  toast('讀完了');
  P.idx = total() - 1;
}
function jump(i){
  const n = total(); if(!n) return;
  P.idx = Math.max(0, Math.min(i, n - 1));
  highlight(P.idx); updateSeek();
  if(P.playing && !P.paused){ hardCancel(); speakAt(P.idx); }
  else { if(P.paused) hardCancel(); saveProgress(true); }
}
function startKeepAlive(){
  // Chrome/Android 約 15 秒會自己停掉，靠 pause+resume 續命；iOS 不需要也不適用
  stopKeepAlive();
  if(IS_IOS || settings.engine === 'audio') return;
  keepAlive = setInterval(() => {
    if(P.playing && !P.paused && speechSynthesis.speaking){
      try{ speechSynthesis.pause(); speechSynthesis.resume(); }catch(e){}
    }
  }, 9000);
}
function stopKeepAlive(){ if(keepAlive){ clearInterval(keepAlive); keepAlive = null; } }
function accumulateTime(){
  if(P.doc && P.t0){ P.doc.seconds = (P.doc.seconds || 0) + (Date.now() - P.t0) / 1000; P.t0 = 0; }
}
function bumpProgress(){
  updateSeek();
  if(++saveCount % 4 === 0) saveProgress(false);
}
async function saveProgress(force){
  if(!P.doc) return;
  P.doc.cursor = P.idx;
  P.doc.lastReadAt = Date.now();
  if(P.t0){ P.doc.seconds = (P.doc.seconds || 0) + (Date.now() - P.t0)/1000; P.t0 = Date.now(); }
  try{ await dbPut('docs', P.doc); }catch(e){}
}

/* ═══ 五、翻譯 ═══════════════════════════════ */
const GTX_CODE = { zh:'zh-TW', en:'en', ja:'ja', el:'el', la:'la', he:'iw' };  // 想翻簡體把 zh 改成 'zh-CN'
const MM_CODE  = { zh:'zh-TW', en:'en', ja:'ja', el:'el-GR', la:'la', he:'he-IL' };
async function gtx(text, sl, tl){
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + sl +
              '&tl=' + tl + '&dt=t&q=' + encodeURIComponent(text);
  const r = await fetch(url);
  if(!r.ok) throw new Error('gtx ' + r.status);
  const j = await r.json();
  return (j[0] || []).map(x => x[0]).join('');
}
async function mymemory(text, sl, tl){
  const r = await fetch('https://api.mymemory.translated.net/get?q=' +
            encodeURIComponent(text) + '&langpair=' + sl + '|' + tl);
  if(!r.ok) throw new Error('mm ' + r.status);
  const j = await r.json();
  const t = j && j.responseData && j.responseData.translatedText;
  if(!t) throw new Error('mm empty');
  return t;
}
// srcLang / tl 都是 'zh' | 'en' | 'ja'
async function translateOne(text, srcLang, tl){
  try{ return await gtx(text, 'auto', GTX_CODE[tl]); }   // 來源交給服務自動判斷，準確度較高
  catch(e){
    return await mymemory(text.slice(0, 480), MM_CODE[srcLang] || 'en', MM_CODE[tl]);
  }
}
let transAbort = false;
async function translateDoc(doc, tl, onProgress){
  migrate(doc);
  const n = doc.sentences.length;
  const prev = doc.translations[tl];
  const res = (prev && prev.length === n) ? prev.slice() : new Array(n).fill('');
  const todo = [];
  for(let i = 0; i < n; i++){
    if(res[i]) continue;
    if(doc.langs[i] === tl){ res[i] = doc.sentences[i]; continue; }   // 本來就是這個語言，直接用
    todo.push(i);
  }
  let done = n - todo.length;
  onProgress(done, n);
  for(let k = 0; k < todo.length; ){
    if(transAbort) break;
    // 合併成一批，減少請求次數
    const batch = []; let chars = 0;
    const srcLang = doc.langs[todo[k]];
    while(k < todo.length && chars < 900 && batch.length < 12 && doc.langs[todo[k]] === srcLang){
      const i = todo[k]; batch.push(i); chars += doc.sentences[i].length + 1; k++;
    }
    let ok = false;
    try{
      const joined = batch.map(i => doc.sentences[i]).join('\n');
      const out = await translateOne(joined, srcLang, tl);
      const lines = out.split('\n').map(s => s.trim()).filter(s => s.length);
      if(lines.length === batch.length){ batch.forEach((i, j) => res[i] = lines[j]); ok = true; }
    }catch(e){ /* 落到逐句 */ }
    if(!ok){
      for(const i of batch){
        if(transAbort) break;
        try{ res[i] = await translateOne(doc.sentences[i], srcLang, tl); }
        catch(e){ res[i] = doc.sentences[i]; }
        await sleep(120);
      }
    }
    done += batch.length;
    onProgress(Math.min(done, n), n);
    doc.translations[tl] = res;
    if(done % 60 < batch.length) { try{ await dbPut('docs', doc); }catch(e){} }
    await sleep(140);
  }
  doc.translations[tl] = res;
  doc.translatedAt = Date.now();
  try{ await dbPut('docs', doc); }catch(e){}
  return res;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ═══ 六、匯入檔案 ═══════════════════════════ */
async function importFiles(fileList){
  for(const f of Array.from(fileList)){
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    try{
      toast('讀取中：' + f.name, 60000);
      let text = '';
      if(ext === 'pdf'){
        const buf = await f.arrayBuffer();
        text = await readPDF(buf, (p, n) => toast(`解析 PDF ${p}/${n} 頁`, 60000));
      }else if(ext === 'docx'){
        text = await readDOCX(await f.arrayBuffer());
      }else if(ext === 'doc'){
        toast('舊版 .doc 無法直接讀取，請先另存成 .docx 或 PDF', 4000); continue;
      }else{
        text = await f.text();
      }
      text = (text || '').trim();
      if(!text || text.length < 8){
        toast('這份檔案抓不到文字，可能是掃描檔（圖片）。需要先做 OCR。', 5000); continue;
      }
      const sentences = splitSentences(text);
      if(!sentences.length){ toast('沒有可朗讀的內容', 3000); continue; }
      const lang = detectDocLang(text);
      const doc = {
        id: uid(), name: f.name.replace(/\.[^.]+$/, ''), ext,
        size: f.size, addedAt: Date.now(),
        sentences, langs: sentences.map(s => sentLang(s, lang)),
        lang, chars: text.length,
        cursor: 0, favorite: false, lastReadAt: 0, seconds: 0,
        translations: {}, finished: false
      };
      await dbPut('docs', doc);
      toast('已加入：' + doc.name, 2000);
    }catch(err){
      console.error(err);
      toast('讀取失敗：' + f.name, 3500);
    }
  }
  render();
}

const WIN = 220;
function renderSentences(reset){
  const list = items(); const n = list.length;
  let [a, b] = P.win;
  if(reset || P.idx < a + 20 || P.idx > b - 20){
    a = Math.max(0, P.idx - Math.floor(WIN / 2));
    b = Math.min(n, a + WIN);
    a = Math.max(0, b - WIN);
    P.win = [a, b];
  }
  const showSrc = P.mode !== 'original' && Number(settings.showSrc);
  let html = a > 0 ? `<button class="more" data-more="up">▲ 往前 ${Math.min(WIN, a)} 句</button>` : '';
  for(let i = a; i < b; i++){
    const it = list[i];
    const dir = it.lang === 'he' ? ' dir="rtl"' : '';          // 希伯來文由右至左
    const sdir = (it.src && RE_HEB.test(it.src)) ? ' dir="rtl"' : '';
    html += `<div class="s ${i === P.idx ? 'cur' : (i < P.idx ? 'done' : '')}" data-i="${i}"${dir}>${esc(it.text)}` +
            (showSrc && it.src ? `<span class="alt"${sdir}>${esc(it.src)}</span>` : '') + '</div>';
  }
  if(b < n) html += `<button class="more" data-more="down">▼ 再讀 ${Math.min(WIN, n - b)} 句</button>`;
  $('#sents').innerHTML = html;
}
$('#sents').addEventListener('click', e => {
  const more = e.target.closest('[data-more]');
  if(more){
    const n = items().length;
    let [a, b] = P.win;
    if(more.dataset.more === 'up'){ a = Math.max(0, a - WIN); b = Math.min(n, a + WIN); }
    else { b = Math.min(n, b + WIN); a = Math.max(0, b - WIN); }
    P.win = [a, b]; renderSentences(false);
    return;
  }
  const s = e.target.closest('.s');
  if(s) jump(Number(s.dataset.i));
});
function highlight(i){
  const [a, b] = P.win;
  if(i < a + 10 || i >= b - 10){ renderSentences(true); }
  else{
    const prev = $('#sents .s.cur');
    if(prev){ prev.classList.remove('cur'); prev.classList.add('done'); }
    const el = $(`#sents .s[data-i="${i}"]`);
    if(el){ el.classList.add('cur'); el.classList.remove('done'); }
  }
  const el = $(`#sents .s[data-i="${i}"]`);
  if(el){
    const r = el.getBoundingClientRect();
    const h = window.innerHeight;
    if(r.top < 80 || r.bottom > h - 160){
      window.scrollBy({ top: r.top - h * 0.36, behavior: 'smooth' });
    }
  }
  updateSeek();
}

/* ═══ 十四、重點整理與匯出 ═════════════════
   離線的「抽取式摘要」：統計全文用詞，算出每一句的資訊量，挑出最有代表
   性的句子，再依原順序排好。它挑的是原文既有的句子，不會自己改寫或杜撰，
   所以內容一定忠於原文。全部在手機裡算，文件不會上傳。            */

const STOP_EN = new Set(('a an the and or but if then than that this these those of in on at to for from by with '+
  'as is are was were be been being it its he she they we you i his her their our your not no do does did have '+
  'has had will would can could should may might must there here what which who whom when where why how all any '+
  'some such own same so too very just also more most other into out up down over under again further once').split(' '));
// 只放純粹的虛詞。像「人、中、上、下、個、自」這些會出現在複合詞裡
// （人工智慧、中小企業），不能列進來，否則關鍵詞會被切斷。
const STOP_ZH = new Set(('的 了 是 在 和 就 不 也 很 到 要 去 你 我 他 她 它 會 著 沒 們 以 及 但 因 為 所 於 與 或 之 '+
  '其 而 則 並 被 把 讓 可 等 此 從 由 且 即 若 亦 已 未 再 更 又 只 還 都 能 說 有 這 那 吧 呢 嗎 啊 麼 什 怎 時 候 '+
  'は が を に の と で も から まで より へ や か ね よ です ます した する ある いる れる られる').split(' '));
const CJK_RUN = /[\u4E00-\u9FFF\u3400-\u4DBF\u3040-\u309F\u30A0-\u30FF]+/g;
const WORD_RUN = /[\p{L}][\p{L}\p{M}']*/gu;

function tokenize(text, lang){
  const out = [];
  if(lang === 'zh' || lang === 'ja'){
    const runs = String(text).match(CJK_RUN) || [];
    for(const r of runs){
      for(let i = 0; i + 1 < r.length; i++){          // 中日文沒有空格，改用「雙字詞」統計
        const bg = r.slice(i, i + 2);
        if(STOP_ZH.has(bg[0]) || STOP_ZH.has(bg[1])) continue;
        out.push(bg);
      }
      if(r.length === 1 && !STOP_ZH.has(r)) out.push(r);
    }
  }else{
    let m; const re = new RegExp(WORD_RUN.source, 'gu');
    while((m = re.exec(String(text))) !== null){
      const w = m[0].toLowerCase();
      if(w.length < 2 || STOP_EN.has(w)) continue;
      out.push(w);
    }
  }
  return out;
}
// 看起來像標題的短句：字少、結尾沒有標點
function looksLikeHeading(s){
  const t = s.trim();
  return t.length >= 2 && t.length <= 32 && !/[。．！？!?；;：:,，、]$/.test(t) && !/[.]$/.test(t);
}
function summarize(list, ratio){
  const n = list.length;
  const df = new Map(), tokensOf = [];
  for(const it of list){
    const tk = tokenize(it.text, it.lang);
    tokensOf.push(tk);
    for(const t of new Set(tk)) df.set(t, (df.get(t) || 0) + 1);
  }
  const tf = new Map();
  tokensOf.forEach(tk => tk.forEach(t => tf.set(t, (tf.get(t) || 0) + 1)));

  const scores = list.map((it, i) => {
    const tk = tokensOf[i];
    if(!tk.length) return { i, score:-1 };
    let sum = 0;
    for(const t of new Set(tk)){
      const idf = Math.log(1 + n / (1 + (df.get(t) || 1)));
      sum += (tf.get(t) || 1) * idf;
    }
    let score = sum / Math.sqrt(tk.length + 4);
    if(i < n * 0.06) score *= 1.25;                    // 開頭常是主旨
    if(it.text.length < 10) score *= 0.35;             // 太短的碎句降權
    if(/[0-9０-９]/.test(it.text)) score *= 1.08;       // 有數字通常是結論或數據
    if(looksLikeHeading(it.text)) score *= 1.15;
    return { i, score };
  });

  const want = Math.max(3, Math.min(n, Math.round(n * ratio)));
  const picked = scores.filter(x => x.score > 0)
                       .sort((a, b) => b.score - a.score)
                       .slice(0, want)
                       .map(x => x.i)
                       .sort((a, b) => a - b);
  const cjk = list.filter(x => x.lang === 'zh' || x.lang === 'ja').length > list.length / 2;
  let ranked = Array.from(tf.entries())
    .filter(([t]) => (df.get(t) || 0) >= 2)
    .sort((a, b) => b[1] - a[1]);
  if(cjk) ranked = mergeGrams(ranked);
  const keywords = dropSubstrings(ranked.map(([t]) => t)).slice(0, 15);
  return { picked, keywords };
}
// 中日文是用雙字統計的，會出現「人工／工智／智慧」這種碎片，
// 把首尾相接且出現次數接近的接回「人工智慧」。
function mergeGrams(pairs){
  let cur = pairs.slice(0, 60);
  for(let pass = 0; pass < 3; pass++){
    const used = new Set(), out = [];
    for(let i = 0; i < cur.length; i++){
      if(used.has(i)) continue;
      used.add(i);
      let t = cur[i][0], c = cur[i][1], grow = true, guard = 0;
      while(grow && guard++ < 6 && t.length < 4){      // 中日文詞彙幾乎都在四字以內
        grow = false;
        for(let j = 0; j < cur.length; j++){
          if(used.has(j)) continue;
          const t2 = cur[j][0], c2 = cur[j][1];
          if(Math.min(c, c2) / Math.max(c, c2) < 0.6) continue;
          if(t.slice(-1) === t2[0]){                    // 往後接：人工 + 工智 → 人工智
            t = t + t2.slice(1); c = Math.min(c, c2); used.add(j); grow = true; break;
          }
          if(t2.slice(-1) === t[0]){                    // 往前接：工智慧 ← 人工
            t = t2.slice(0, -1) + t; c = Math.min(c, c2); used.add(j); grow = true; break;
          }
        }
      }
      out.push([t, c]);
    }
    cur = out.sort((a, b) => b[1] - a[1]);
  }
  return cur;
}
function dropSubstrings(terms){
  return terms.filter((t, i) => !terms.some((o, j) => j !== i && o.length > t.length && o.indexOf(t) >= 0));
}
function estimateMinutes(doc){
  let sec = 0;
  doc.sentences.forEach((s, i) => {
    const cps = (doc.langs[i] === 'zh' || doc.langs[i] === 'ja') ? 4.8 : 14;
    sec += s.length / cps;
  });
  return Math.max(1, Math.round(sec / 60));
}
function pad2(x){ return x < 10 ? '0' + x : String(x); }
function stamp(){
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) +
         ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function buildReport(doc, opt){
  const list = items();                                 // 目前看的是原文還是譯文，就整理哪一份
  const modeName = P.mode === 'original' ? '原文（' + LANG_NAME[doc.lang] + '）' : LANG_NAME[P.mode] + '譯文';
  const { picked, keywords } = summarize(list, opt.ratio);
  const chars = list.reduce((a, x) => a + x.text.length, 0);
  const L = [];
  const rule = '════════════════════════════════';
  L.push(rule, doc.name, rule, '');
  L.push('來源檔案：' + doc.name + '.' + doc.ext);
  L.push('整理內容：' + modeName);
  L.push('字數：' + chars.toLocaleString() + '　句數：' + list.length);
  L.push('預估朗讀時間：約 ' + estimateMinutes(doc) + ' 分鐘（1× 語速）');
  L.push('整理時間：' + stamp());
  L.push('');
  if(keywords.length){
    L.push('──── 關鍵詞 ────');
    L.push(keywords.join('、'));
    L.push('');
  }
  const heads = [];
  list.forEach((it, i) => { if(looksLikeHeading(it.text) && heads.length < 30) heads.push(it.text.trim()); });
  if(heads.length >= 3){
    L.push('──── 可能的章節標題 ────');
    heads.forEach((h, i) => L.push((i + 1) + '. ' + h));
    L.push('');
  }
  L.push('──── 重點摘要（' + picked.length + ' / ' + list.length + ' 句，約 ' +
         Math.round(picked.length / list.length * 100) + '%）────');
  picked.forEach((idx, k) => L.push((k + 1) + '. ' + list[idx].text.trim()));
  L.push('');
  if(opt.full){
    L.push('──── 全文逐字稿 ────');
    list.forEach((it, i) => {
      L.push(String(i + 1).padStart(4, ' ') + '｜' + it.text.trim());
      if(opt.bi && it.src) L.push('    ↳ ' + it.src.trim());
    });
    L.push('');
  }
  L.push(rule);
  L.push('由「聽文件」整理。重點摘要是從原文挑出的句子，未經改寫。');
  return L.join('\n');
}

/* 存成 txt：iPhone 走系統分享（存到「檔案」），其他裝置直接下載 */
async function saveTxt(filename, text){
  const blob = new Blob(['\ufeff' + text], { type:'text/plain;charset=utf-8' });
  try{
    const file = new File([blob], filename, { type:'text/plain' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:filename });
      return;
    }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  toast('已下載 ' + filename, 3000);
}

let lastReport = '';
$('#cSum').addEventListener('click', () => {
  if(!P.doc) return;
  $('#rowBi').style.display = (P.mode !== 'original') ? '' : 'none';
  $('#sPrev').style.display = 'none';
  $('#sActs').style.display = 'none';
  $('#sheetSum').classList.add('show');
});
$('#sClose').addEventListener('click', () => $('#sheetSum').classList.remove('show'));
$('#sheetSum').addEventListener('click', e => { if(e.target.id === 'sheetSum') e.currentTarget.classList.remove('show'); });
$('#sMake').addEventListener('click', () => {
  if(!P.doc) return;
  const btn = $('#sMake'); btn.textContent = '整理中…'; btn.classList.add('busy');
  setTimeout(() => {
    try{
      lastReport = buildReport(P.doc, {
        ratio: Number($('#sRatio').value),
        full: Number($('#sFull').value),
        bi: Number($('#sBi').value)
      });
      const pv = $('#sPrev');
      pv.textContent = lastReport.slice(0, 4000) + (lastReport.length > 4000 ? '\n\n…（預覽到此，完整內容請下載）' : '');
      pv.style.display = ''; $('#sActs').style.display = '';
    }catch(err){ console.error(err); toast('整理失敗', 3000); }
    btn.textContent = '重新產生'; btn.classList.remove('busy');
  }, 30);
});
$('#sSave').addEventListener('click', () => {
  if(!lastReport || !P.doc) return;
  const safe = P.doc.name.replace(/[\\/:*?"<>|]/g, '_').slice(0, 40);
  saveTxt(safe + '_重點整理.txt', lastReport);
});
$('#sCopy').addEventListener('click', async () => {
  if(!lastReport) return;
  try{ await navigator.clipboard.writeText(lastReport); toast('已複製到剪貼簿'); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = lastReport; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('已複製到剪貼簿'); }catch(e2){ toast('複製失敗，請改用下載'); }
    ta.remove();
  }
});

});
